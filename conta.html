<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Minha conta — BurgerTop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/conta.css">
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/conta.js" defer></script>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="brand" href="index.html">Burger<span>Top</span></a><nav aria-label="Navegação principal"><a href="index.html">Ver produtos</a><a href="login.html" data-account-link>Entrar</a></nav></div></header>
  <div id="account-loading" class="account-loading"><p id="account-loading-text" role="status">Carregando sua conta…</p><button class="signout-button" id="account-retry" type="button" hidden>Tentar novamente</button><a class="primary-button local-access-link" id="open-local-account" href="http://127.0.0.1:4173/conta.html" hidden>Abrir conta local</a></div>
  <main id="account-content" class="account-main" hidden>
    <div class="account-top"><div><h1 id="account-welcome">Minha conta</h1><p>Seu perfil e seus pedidos por aqui.</p></div></div>
    <p class="auth-message" id="account-message" role="status" hidden></p>
    <div class="account-grid">
      <section class="account-card" aria-labelledby="profile-title"><h2 id="profile-title">Seu perfil</h2><p class="account-email" id="account-email"></p><form id="profile-form"><div class="field"><label for="profile-name">Nome</label><input id="profile-name" name="name" autocomplete="name" required minlength="2" maxlength="80"></div><button class="primary-button" type="submit" id="save-profile">Salvar nome</button></form></section>
      <section class="account-card" aria-labelledby="orders-title"><h2 id="orders-title">Meus pedidos</h2><p class="account-status" id="orders-status" role="status"></p><ul class="order-list" id="orders-list"></ul><button class="text-button" id="refresh-orders" type="button">Atualizar pedidos</button><p class="cart-note">Os pedidos registrados neste projeto não incluem pagamento nem envio para uma loja física.</p></section>
    </div>
  </main>
</body>
</html>
